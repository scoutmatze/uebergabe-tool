services:
  traefik:
    image: traefik:v2.11 # NICHT v3 (Docker-API-Inkompatibilität)
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Netzname muss zum externen Netz unten passen:
      - "--providers.docker.network=uebergabe_web"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--certificatesresolvers.le.acme.email=mathias.meyer@dpsg1300.de"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - web

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
    volumes:
      - audio:/data/audio
      - material:/data/material
    networks:
      - web
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uebergabe.rule=Host(`uebergabe.dpsgonline.de`)"
      - "traefik.http.routers.uebergabe.entrypoints=websecure"
      - "traefik.http.routers.uebergabe.tls.certresolver=le"
      - "traefik.http.services.uebergabe.loadbalancer.server.port=3000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal

volumes:
  letsencrypt:
  pgdata:
  audio:
  material:

networks:
  web:
    name: uebergabe_web
    external: true
  internal:
