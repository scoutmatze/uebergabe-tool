services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
    volumes:
      - audio:/data/audio
      - material:/data/material
    networks:
      - web
      - internal
    labels:
      - "traefik.enable=true"
      # Eigene, eindeutige Router-/Service-Namen (kollidieren nicht mit den anderen bundesamt-Apps):
      - "traefik.http.routers.uebergabearchiv.rule=Host(`uebergabe.dpsgonline.de`)"
      - "traefik.http.routers.uebergabearchiv.entrypoints=websecure"
      # WICHTIG: certresolver-Name muss dem laufenden Traefik auf dem bundesamt-Server entsprechen.
      # Beim Reisekosten-Stack ist das i.d.R. "letsencrypt" – vor dem Start verifizieren (siehe README).
      - "traefik.http.routers.uebergabearchiv.tls.certresolver=letsencrypt"
      - "traefik.http.services.uebergabearchiv.loadbalancer.server.port=3000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal

volumes:
  pgdata:
  audio:
  material:

networks:
  # Bestehendes, vom laufenden Traefik verwaltetes Netz auf dem bundesamt-Server:
  web:
    name: dpsg-reisekosten_web
    external: true
  internal:
